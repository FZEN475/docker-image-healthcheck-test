include:
  - component: $CI_SERVER_FQDN/library/cicd/auto-gitlab/auto-release@main
  - local: '.gitlab-ci.docker-healthcheck.yml'

variables:
  CI_DEBUG_TRACE: "false"

stages:
  - package-test
  - auto-gitlab

.utils:toolkit:shared:auto-release-RELEASE-md:
  - |
    cat > RELEASE.md <<EOF
    ### Release ${CI_COMMIT_TAG}

    #### Features
    * **docker-healthcheck:** Проверка состояния контейнеров через удалённый Docker-хост.

    EOF